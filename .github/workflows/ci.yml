# Based on moonbit-community/.github workflow-templates/check.yml, plus a
# job that verifies MoonBit -> Yjs interop with the pinned Yjs version.
name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: moon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --deny-warn --target all

      - name: moon test
        run: moon test --target all

      - name: moon fmt
        run: moon fmt --check

      - name: moon info
        run: |
          moon info
          git diff --exit-code

  interop:
    name: Yjs interop (MoonBit -> Yjs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: install pinned yjs
        working-directory: scripts
        run: npm ci

      - name: fixtures are reproducible from yjs
        run: |
          node scripts/gen_fixtures.mjs
          moon fmt
          git diff --exit-code

      - name: export MoonBit edits
        run: moon run cmd/export --target native > fixtures/moonbit_out.json

      - name: benchmarks run (timings are not checked)
        run: moon bench -p sayoi7799/moon_ycrdt/benchmarks --target native --release

      - name: verify with yjs
        run: node scripts/verify_moonbit.mjs fixtures/moonbit_out.json

      - name: exported fixture is up to date
        run: git diff --exit-code -- fixtures/moonbit_out.json

      - name: example is readable by yjs
        run: |
          moon run examples/concurrent --target native | tee example.txt
          node scripts/read_update.mjs "$(tail -1 example.txt | cut -d' ' -f3)" doc

      - name: Yjs -> MoonBit -> Yjs round trip example
        run: |
          node scripts/make_example_input.mjs > input.txt
          moon run examples/roundtrip --target native -- "$(cat input.txt)" | tee roundtrip.txt
          node scripts/read_update.mjs "$(tail -1 roundtrip.txt | cut -d' ' -f3)" doc | tee read.txt
          grep -q 'MoonBit\] Written in Yjs' read.txt
